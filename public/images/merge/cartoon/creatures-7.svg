<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title">
  <title id="title">Unicorn</title>
  <metadata>Original Doodle Heroes storybook artwork. SPDX-License-Identifier: CC0-1.0</metadata>
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="clay" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.2" result="blur"/>
      <feDiffuseLighting in="blur" surfaceScale="3.5" diffuseConstant="1.15" lighting-color="#ffffff" result="diffuse"><feDistantLight azimuth="235" elevation="58"/></feDiffuseLighting>
      <feComposite in="SourceGraphic" in2="diffuse" operator="arithmetic" k1="1.08" result="shaded"/>
      <feSpecularLighting in="blur" surfaceScale="4" specularConstant=".85" specularExponent="26" lighting-color="#ffffff" result="spec"><fePointLight x="34" y="14" z="90"/></feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="gloss"/>
      <feComposite in="gloss" in2="shaded" operator="arithmetic" k2=".75" k3="1"/>
    </filter>
  </defs>
  <ellipse cx="64" cy="114" rx="38" ry="7" fill="#2E3B33" opacity=".22" filter="url(#soft)"/>
  <g filter="url(#clay)"><g stroke="#2E3B33" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M34 76 Q9 68 14 91 Q27 82 37 95Z" fill="#A48AE6" /><ellipse cx="62" cy="85" rx="31" ry="20" fill="#FFF3D6" /><path d="M42 94 V113 H52 L56 96 M75 94 L79 113 H89 L86 91" fill="#FFF3D6" /><path d="M69 80 Q56 58 71 39 Q86 26 97 44 L105 62 Q105 75 83 75 L84 92Z" fill="#FFF3D6" /><path d="M71 40 Q53 40 55 62 Q43 63 51 80 L68 84 L67 66Z" fill="#A48AE6" /><path d="M83 36 L90 12 L96 39Z" fill="#F7C23E" /><path d="M76 40 L70 25 L85 34Z" fill="#FFF3D6" /><circle cx="90" cy="52" r="3" fill="#2E3B33" stroke="none"/><ellipse cx="98" cy="63" rx="4" ry="2" fill="#F59A6B" stroke="none"/><path d="M91 69 Q98 72 101 67" fill="none" stroke-width="2"/><path d="M32 41 L34.4 46.6 L40 49 L34.4 51.4 L32 57 L29.6 51.4 L24 49 L29.6 46.6Z" fill="#F7C23E" /></g></g>
