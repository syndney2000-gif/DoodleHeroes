<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title">
  <title id="title">Hero of the Margin</title>
  <metadata>Original Doodle Heroes storybook artwork. SPDX-License-Identifier: CC0-1.0</metadata>
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="clay" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.2" result="blur"/>
      <feDiffuseLighting in="blur" surfaceScale="3.5" diffuseConstant="1.15" lighting-color="#ffffff" result="diffuse"><feDistantLight azimuth="235" elevation="58"/></feDiffuseLighting>
      <feComposite in="SourceGraphic" in2="diffuse" operator="arithmetic" k1="1.08" result="shaded"/>
      <feSpecularLighting in="blur" surfaceScale="4" specularConstant=".85" specularExponent="26" lighting-color="#ffffff" result="spec"><fePointLight x="34" y="14" z="90"/></feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="gloss"/>
      <feComposite in="gloss" in2="shaded" operator="arithmetic" k2=".75" k3="1"/>
    </filter>
  </defs>
  <ellipse cx="64" cy="114" rx="38" ry="7" fill="#2E3B33" opacity=".22" filter="url(#soft)"/>
  <g filter="url(#clay)"><g stroke="#2E3B33" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M40 64 L20 108 Q40 105 51 98 L94 109 L91 63Z" fill="#A48AE6" /><path d="M45 70 Q64 62 82 70 L87 99 Q64 108 40 99Z" fill="#8FCB6E" /><path d="M50 101 L47 111 M76 101 L80 111" fill="none" stroke-width="7"/><circle cx="64" cy="45" r="24" fill="#FFF3D6" /><path d="M41 32 L38 15 L53 24 L63 10 L75 24 L89 15 L87 32Z" fill="#F7C23E" /><circle cx="64" cy="25" r="3" fill="#F07C98" /><circle cx="54" cy="47" r="2.4" fill="#2E3B33" stroke="none"/><circle cx="74" cy="47" r="2.4" fill="#2E3B33" stroke="none"/><path d="M60 53 Q64 57 68 53" fill="none" stroke-width="2"/><ellipse cx="51" cy="52" rx="3.5" ry="2" fill="#F59A6B" stroke="none"/><ellipse cx="77" cy="52" rx="3.5" ry="2" fill="#F59A6B" stroke="none"/><path d="M64 71 L67.6 79.4 L76 83 L67.6 86.6 L64 95 L60.4 86.6 L52 83 L60.4 79.4Z" fill="#F7C23E" /><path d="M92 98 L101 49 M92 61 L108 65" fill="none" stroke-width="5"/><path d="M100 49 L106 32 L109 51Z" fill="#F7C23E" /><circle cx="92" cy="78" r="6" fill="#FFF3D6" /><path d="M23 36 L25.1 40.9 L30 43 L25.1 45.1 L23 50 L20.9 45.1 L16 43 L20.9 40.9Z" fill="#F7C23E" /></g></g>
